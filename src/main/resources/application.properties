spring.application.name=customerRewards

spring.datasource.url=jdbc:h2:mem:rewards;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.jwt.secret=customer-rewards-development-secret-key-change-me
app.jwt.expiration-ms=3600000

# In-memory local limiting. Forwarded headers are ignored unless the immediate
# peer is explicitly listed as a trusted proxy.
app.rate-limit.enabled=true
app.rate-limit.capacity=100
app.rate-limit.refill-tokens=100
app.rate-limit.refill-duration=1m
app.rate-limit.max-local-buckets=10000
app.rate-limit.bucket-expiration=10m
app.rate-limit.trust-forwarded-for=false
# app.rate-limit.trusted-proxies=10.0.0.10,10.0.0.0/24

# Reward tiers are progressive and use whole dollars. The first entry is the
# zero-point baseline; add another indexed entry to extend the reward program.
# A $120 purchase earns (100 - 50) * 1 + (120 - 100) * 2 = 90 points.
rewards.tiers[0].threshold=0
rewards.tiers[0].rate=0
rewards.tiers[1].threshold=50
rewards.tiers[1].rate=1
rewards.tiers[2].threshold=100
rewards.tiers[2].rate=2
